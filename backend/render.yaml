services:
  - type: web
    name: fixnear-backend
    env: node
    plan: free
    region: singapore # Closest low-latency region for India
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
